[platformio]
default_envs = native-display
src_dir = .

[env:native-display]
platform = native
build_flags =
    -std=gnu++17
    -I emulations/display/include
build_src_filter =
    -<**/*>
    +<emulations/display/src/main.cpp>
    +<emulations/display/src/mouse_touch.cpp>
    +<emulations/display/src/raster_display_host.cpp>
    +<emulations/display/src/scenario_source.cpp>
lib_extra_dirs =
    components/display
    components/radar/core

[env:native-tests]
platform = native
build_flags = -std=gnu++17
test_framework = unity
build_src_filter = -<**/*>
lib_extra_dirs =
    components/display
    components/radar/core

[env:s3-display-bench]
platform = espressif32 @ 7.0.1
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
upload_speed = 460800
board_upload.flash_size = 16MB
board_upload.maximum_size = 16777216
board_build.flash_mode = qio
board_build.arduino.memory_type = qio_opi
board_build.partitions = default_16MB.csv
build_unflags = -std=gnu++11
build_flags =
    -std=gnu++17
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_CDC_ON_BOOT=1
    -I firmware/display-s3/include
build_src_filter =
    -<**/*>
    +<experiments/display-bench/src/main.cpp>
    +<firmware/display-s3/src/n203_lgfx_device.cpp>
lib_deps =
    lovyan03/LovyanGFX @ 1.2.25

[env:s3-display-bench-rdp]
extends = env:s3-display-bench
upload_speed = 115200
board_upload.before_reset = no_reset
board_upload.after_reset = no_reset

[env:s3-display-demo]
extends = env:s3-display-bench
build_flags =
    ${env:s3-display-bench.build_flags}
    -I experiments/display-demo/include
    -I components/display/include
    -I components/radar/core/include
build_src_filter =
    -<**/*>
    +<experiments/display-demo/src/main.cpp>
    +<experiments/display-demo/src/demo_radar_source.cpp>
    +<firmware/display-s3/src/n203_lgfx_device.cpp>
    +<firmware/display-s3/src/lovyan_gfx_canvas.cpp>
    +<firmware/display-s3/src/dirty_tile_framebuffer.cpp>
    +<firmware/display-s3/src/xpt2046_touch_input.cpp>
    +<components/display/src/**/*.cpp>
    +<components/radar/core/src/**/*.cpp>

[env:s3-display-demo-rdp]
extends = env:s3-display-demo
upload_speed = 115200
board_upload.before_reset = no_reset
board_upload.after_reset = no_reset

[env:s3-touch-bench]
extends = env:s3-display-bench
build_src_filter =
    -<**/*>
    +<experiments/touch-bench/src/main.cpp>
    +<firmware/display-s3/src/n203_lgfx_device.cpp>

[env:s3-touch-bench-rdp]
extends = env:s3-touch-bench
upload_speed = 115200
board_upload.before_reset = no_reset
board_upload.after_reset = no_reset

[env:s3-scanner-display]
extends = env:s3-display-bench
build_flags =
    ${env:s3-display-bench.build_flags}
    -I components/display/include
    -I components/radar/core/include
    -I components/radar/protocol/include
build_src_filter =
    -<**/*>
    +<firmware/display-s3/src/scanner_main.cpp>
    +<firmware/display-s3/src/n203_lgfx_device.cpp>
    +<firmware/display-s3/src/lovyan_gfx_canvas.cpp>
    +<firmware/display-s3/src/dirty_tile_framebuffer.cpp>
    +<firmware/display-s3/src/xpt2046_touch_input.cpp>
    +<firmware/display-s3/src/uart_radar_source.cpp>
    +<components/display/src/**/*.cpp>
    +<components/radar/core/src/**/*.cpp>
    +<components/radar/protocol/src/**/*.cpp>

[env:s3-scanner-display-rdp]
extends = env:s3-scanner-display
upload_speed = 115200
board_upload.before_reset = no_reset
board_upload.after_reset = no_reset

[env:s3-c4001-display]
extends = env:s3-scanner-display
build_flags =
    ${env:s3-scanner-display.build_flags}
    -DN203_S3_DIRECT_C4001=1
    -I components/radar/c4001/include
build_src_filter =
    ${env:s3-scanner-display.build_src_filter}
    +<firmware/display-s3/src/c4001_direct_radar_source.cpp>
    +<components/radar/c4001/src/**/*.cpp>

[env:s3-c4001-display-rdp]
extends = env:s3-c4001-display
upload_speed = 115200
board_upload.before_reset = no_reset
board_upload.after_reset = no_reset

[env:s3-c4001-position-display]
extends = env:s3-c4001-display
build_flags =
    ${env:s3-c4001-display.build_flags}
    -DN203_S3_C4001_POSITION=1

[env:s3-c4001-position-display-rdp]
extends = env:s3-c4001-position-display
upload_speed = 115200
board_upload.before_reset = no_reset
board_upload.after_reset = no_reset

