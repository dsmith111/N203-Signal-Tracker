[platformio]
default_envs = native-display

[env:native-display]
platform = native
build_flags =
    -std=gnu++17
    -I emulations/display/include
src_dir = emulations/display/src
lib_extra_dirs =
    components/display
    components/radar/core

[env:native-tests]
platform = native
build_flags = -std=gnu++17
test_framework = unity
lib_extra_dirs =
    components/display
    components/radar/core
